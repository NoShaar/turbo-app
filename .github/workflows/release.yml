name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  checagem:
    name: Checagem de compilação
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compilar sem publicar este build
        run: cargo build --release --features ui --bin turbo-app

  publicar:
    name: Publicar arquivos assinados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir os arquivos já assinados
        run: |
          test -f dist/TurboApp-Setup.exe
          test -f releases/latest.json
          if [ -f releases/SHA256SUMS.txt ]; then
            echo "SUMS=releases/SHA256SUMS.txt" >> "$GITHUB_ENV"
          elif [ -f dist/SHA256SUMS.txt ]; then
            echo "SUMS=dist/SHA256SUMS.txt" >> "$GITHUB_ENV"
          else
            echo "Falta releases/SHA256SUMS.txt ou dist/SHA256SUMS.txt" >&2
            exit 1
          fi
      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(python3 -c "import json; print(json.load(open('releases/latest.json')).get('notes',''))")
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              dist/TurboApp-Setup.exe \
              releases/latest.json \
              "$SUMS" \
              --clobber
          else
            gh release create "$tag" \
              dist/TurboApp-Setup.exe \
              releases/latest.json \
              "$SUMS" \
              --title "$tag" \
              --notes "$notes"
          fi
