[package]
name = "turbo-app"
version = "1.0.1"
edition = "2021"
description = "Otimização segura e reversível do Windows 11 para Valorant e League of Legends"
publish = false
license = "MIT"
rust-version = "1.88"

[lib]
name = "turbo"
path = "src/lib.rs"

[[bin]]
name = "turbo-app"
path = "src/main.rs"
required-features = ["ui"]

[[bin]]
name = "turbo-sign"
path = "src/bin/turbo-sign.rs"

[features]
default = []
ui = ["dep:slint", "dep:slint-build"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
ed25519-dalek = { version = "=2.1.1", features = ["rand_core"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = { version = "=1.12.1", optional = true, default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
thiserror = "1"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }

[target.'cfg(windows)'.dependencies]
wmi = "=0.14.3"
windows = { version = "=0.58.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_EventLog",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Restore",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "=0.58.0"

[build-dependencies]
slint-build = { version = "=1.12.1", optional = true }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
